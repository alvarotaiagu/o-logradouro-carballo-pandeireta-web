<!DOCTYPE html>
<html lang="gl" data-titulo-es="Esta copla no existe · O Logradouro">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esta copla non existe · O Logradouro</title>
<script>
/* Idioma: ?lang= › elección guardada en la portada › galego. */
(function () {
  var h = document.documentElement, l = (/[?&]lang=(gl|es)\b/.exec(location.search) || [])[1];
  if (!l) { try { l = localStorage.getItem('logradouro-idioma'); } catch (e) {} }
  l = l === 'es' ? 'es' : 'gl';
  h.lang = l;
  h.setAttribute('data-idioma', l);
  if (l === 'es' && h.getAttribute('data-titulo-es')) document.title = h.getAttribute('data-titulo-es');
})();
</script>
<link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Karla:wght@400;700&display=swap">
<style>
  :root { --noche: #16130F; --piel: #EFE7D6; --lazo: #C4262E; --mostaza: #E9B949; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center;
    background: var(--noche); color: var(--piel); font-family: Karla, system-ui, sans-serif; padding: 1.5rem;
  }
  main { max-width: 460px; text-align: center; }
  .numero { font: 400 clamp(4.5rem, 18vw, 7rem)/1 "Young Serif", Georgia, serif; color: var(--mostaza); margin: 0; }
  h1 { font: 400 clamp(1.6rem, 6vw, 2.2rem)/1.2 "Young Serif", Georgia, serif; margin: .6rem 0 .8rem; }
  p { color: color-mix(in srgb, var(--piel) 66%, transparent); line-height: 1.6; margin: 0 0 2rem; }
  a { display: inline-block; padding: 1rem 1.7rem; border-radius: 999px; background: var(--lazo); color: #fff; font-weight: 700; text-decoration: none; }
  a:focus-visible { outline: 3px solid var(--mostaza); outline-offset: 3px; }
  /* sin JS no hay data-idioma: se ve el galego */
  html:not([data-idioma="es"]) [data-idioma-bloque="es"], html[data-idioma="es"] [data-idioma-bloque="gl"] { display: none; }
</style>
</head>
<body>
  <main>
    <p class="numero">404</p>
    <div data-idioma-bloque="gl" lang="gl">
      <h1>Esta copla non existe.</h1>
      <p>A páxina que buscas non está no cancioneiro. A taberna, si, na Rúa Lugo, 2.</p>
    </div>
    <div data-idioma-bloque="es" lang="es">
      <h1>Esta copla no existe.</h1>
      <p>La página que buscas no está en el cancionero. La taberna, sí, en la Rúa Lugo, 2.</p>
    </div>
    <a href="./">Volver a O Logradouro</a>
  </main>
</body>
</html>
